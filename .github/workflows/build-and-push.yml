name: Build and Push to Docker Hub

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ========== BACKEND BUILD ==========
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build Backend with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backend-jars
          path: backend/**/target/*.jar
          retention-days: 5

  # ========== FRONTEND BUILD ==========
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/smartmarket-web/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend/smartmarket-web
          npm ci

      - name: Build Angular Application
        run: |
          cd frontend/smartmarket-web
          npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-dist
          path: frontend/smartmarket-web/dist
          retention-days: 5

  # ========== FRONTEND TESTS ==========
  test-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/smartmarket-web/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend/smartmarket-web
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend/smartmarket-web
          npm run test -- --run || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v3
        with:
          name: frontend-coverage
          path: frontend/smartmarket-web/coverage
          retention-days: 5

  # ========== BACKEND TESTS ==========
  test-backend:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Run Backend Tests
        run: |
          cd backend
          mvn clean test

      - name: Generate Test Coverage Report
        run: |
          cd backend
          mvn jacoco:report || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage
          path: backend/**/target/site/jacoco
          retention-days: 5

  # ========== DOCKER BUILD & PUSH ==========
  docker-push:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push'
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - supermarket-service
          - product-service
          - billing-service
          - concierge-service
          - client-service
          - notification-service
          - recommendation-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build ${{ matrix.service }} JAR
        run: |
          cd backend
          if [ "${{ matrix.service }}" = "api-gateway" ]; then
            mvn clean package -DskipTests -pl api-gateway
          else
            mvn clean package -DskipTests -pl services/${{ matrix.service }}
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Determine Docker context path
        id: docker-context
        run: |
          if [ "${{ matrix.service }}" = "api-gateway" ]; then
            echo "context=backend/api-gateway" >> $GITHUB_OUTPUT
          else
            echo "context=backend/services/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ steps.docker-context.outputs.context }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smartmarket-${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/smartmarket-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartmarket-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartmarket-${{ matrix.service }}:buildcache,mode=max

  # ========== FRONTEND DOCKER PUSH ==========
  docker-push-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/smartmarket-web/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend/smartmarket-web
          npm ci

      - name: Build Angular Application
        run: |
          cd frontend/smartmarket-web
          npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: frontend/smartmarket-web
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smartmarket-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/smartmarket-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartmarket-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartmarket-frontend:buildcache,mode=max
          file: frontend/smartmarket-web/Dockerfile
