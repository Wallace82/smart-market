name: Build and Deploy SmartMarket Services

on:
  push:
    branches: [main]

jobs:
  # ========== API GATEWAY BUILD & PUSH ==========
  build-api-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build API Gateway JAR
        run: |
          cd backend
          mvn clean package -DskipTests -pl api-gateway

      - name: Login to Docker Hub
        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p '${{secrets.DOCKER_PASSWORD}}'

      - name: Build and Push API Gateway Docker image
        run: |
          cd backend/api-gateway
          docker build -t ${{secrets.DOCKER_USERNAME}}/smartmarket-api-gateway .
          docker push ${{secrets.DOCKER_USERNAME}}/smartmarket-api-gateway

  # ========== AUTH SERVICE BUILD & PUSH ==========
  build-auth-service:
