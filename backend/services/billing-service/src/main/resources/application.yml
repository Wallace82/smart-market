server:
  port: 8084

spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartmarket}?currentSchema=billing
    username: ${DB_USER:smartmarket}
    password: ${DB_PASSWORD:smartmarket}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    schemas: billing
    create-schemas: true
    locations: classpath:db/migration
    validate-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
