server:
  port: 8085

spring:
  application:
    name: concierge-service
  cloud:
    openfeign:
      client:
        config:
          default:
            decode404: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartmarket}
    username: ${DB_USER:smartmarket}
    password: ${DB_PASSWORD:smartmarket}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:admin}
  secretKey: ${MINIO_SECRET_KEY:password}
  bucket: smartmarket-concierge

concierge:
  sla-padrao-horas: 3
  pesos:
    sla: 0.4
    plano: 0.3
    tempo: 0.2
    complexidade: 0.1
  scheduler:
    recalculation-rate-ms: 60000 # 1 minuto

services:
  billing-service:
    url: ${BILLING_SERVICE_URL:http://localhost:8084}

logging:
  level:
    com.smartmarket.concierge: DEBUG
    org.springframework.web: INFO
