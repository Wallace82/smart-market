server:
  port: 8087

spring:
  application:
    name: notification-service
  cloud:
    openfeign:
      client:
        config:
          default:
            decode404: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartmarket}?currentSchema=notification
    username: ${DB_USER:smartmarket}
    password: ${DB_PASSWORD:smartmarket}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: notification
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: notification
    create-schemas: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

services:
  supermarket-service:
    url: ${SUPERMARKET_SERVICE_URL:http://localhost:8082}
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8083}

app:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@smartmarket.com}

logging:
  level:
    com.smartmarket.notification: DEBUG
    org.springframework.web: INFO
