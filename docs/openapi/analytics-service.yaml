openapi: 3.0.3
info:
  title: SmartMarket Analytics Service API
  version: 2.0.0
  description: |
    Contrato do módulo `analytics` para o MVP do SmartMarket (v2.0).
    
    Responsável por métricas essenciais (RF-08):
    - RF-08.1: Visualizações por encarte
    - RF-08.2: Escaneamentos de QR Code (via parâmetro UTM)
    - RF-08.3: Dashboard do Gestor (encartes publicados, total de visualizações, acessos QR)
    
    > **Fora do escopo MVP:** Heatmaps, funis de conversão, tracking de sessão anônima,
    > footfall attribution, analytics comportamental. Ver backlog pós-MVP.
servers:
  - url: /api/v1
tags:
  - name: Events
    description: Ingestão de eventos de telemetria (público)
  - name: Dashboard
    description: Métricas consolidadas para o Gestor

paths:

  /public/analytics/events:
    post:
      tags: [Events]
      summary: Registrar evento de telemetria (público)
      description: |
        Endpoint público para captura de eventos MVP. Não requer autenticação (RF-01.4).
        Processado de forma assíncrona.
      operationId: registerEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryEventRequest'
      responses:
        '202':
          description: Evento recebido e enfileirado para processamento

  /manager/analytics/dashboard:
    get:
      tags: [Dashboard]
      summary: Métricas do Dashboard do Gestor (RF-08.3)
      description: |
        Retorna métricas básicas do supermercado autenticado:
        encartes publicados, total de visualizações e acessos via QR Code.
      operationId: getManagerDashboard
      security:
        - bearerAuth: []
      parameters:
        - name: supermarketId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Métricas do gestor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDashboardResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    TelemetryEventRequest:
      type: object
      required: [eventType, resourceId]
      properties:
        eventType:
          type: string
          description: |
            Tipos de evento suportados no MVP:
            - FLYER_VIEW: Visualização de encarte (RF-08.1)
            - QR_CODE_SCANNED: Acesso via QR Code (RF-08.2)
          enum:
            - FLYER_VIEW
            - QR_CODE_SCANNED
        resourceId:
          type: string
          format: uuid
          description: ID do encarte (FLYER_VIEW) ou do supermercado (QR_CODE_SCANNED)
        supermarketId:
          type: string
          format: uuid
        utmSource:
          type: string
          description: Parâmetro UTM para identificar origem do acesso (RF-07.4)
          example: totem

    ManagerDashboardResponse:
      type: object
      description: Métricas básicas do MVP para o Dashboard do Gestor (RF-08.3)
      properties:
        supermarketId:
          type: string
          format: uuid
        totalPublishedFlyers:
          type: integer
          description: Total de encartes com status ATIVO no período
        totalFlyerViews:
          type: integer
          description: Total de visualizações de encartes (RF-08.1)
        totalQrCodeScans:
          type: integer
          description: Total de escaneamentos via QR Code (RF-08.2)
        flyerViewsTimeline:
          type: array
          description: Série temporal de visualizações por dia
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              views:
                type: integer
              qrScans:
                type: integer

    ErrorResponse:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time