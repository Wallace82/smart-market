openapi: 3.0.3
info:
  title: SmartMarket Auth Service API
  version: 2.0.0
  description: |
    Contrato do módulo `auth` para o MVP do SmartMarket (v2.0).
    
    **Perfis suportados no MVP:** ADMIN e GESTOR.
    Acesso público não requer autenticação (vitrine, encartes, QR Code — RF-01.4).
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Autenticação e gestão de tokens JWT
  - name: Users
    description: Gestão de usuários (Admin e Gestor)

paths:

  /auth/login:
    post:
      tags: [Auth]
      summary: Autenticar usuário com e-mail e senha
      description: Retorna um par de tokens JWT (access + refresh). Usado por Admin e Gestor.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar access token
      description: Emite um novo access token a partir de um refresh token válido.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token renovado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Refresh token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Iniciar recuperação de senha
      description: |
        Envia um e-mail com link/token temporário para redefinição de senha.
        Responde com 202 independente de o e-mail existir (segurança contra enumeração).
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Solicitação recebida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Redefinir senha com token temporário
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Senha redefinida com sucesso
        '400':
          description: Token inválido, expirado ou senha fora da política
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/users:
    post:
      tags: [Users]
      summary: Criar usuário (somente Admin)
      description: |
        Cria um usuário com role ADMIN ou GESTOR. Apenas ADMIN pode executar esta operação.
        No MVP não há auto-cadastro de clientes (ROLE_CLIENTE é pós-MVP).
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                type: string
                example: Usuário criado com sucesso.
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    get:
      tags: [Users]
      summary: Listar todos os usuários (somente Admin)
      description: Retorna a lista de todos os usuários cadastrados no banco de dados. Apenas ADMIN pode executar esta operação.
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuários carregada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'

  /users/{id}:
    get:
      tags: [Users]
      summary: Consultar usuário por ID
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}/status:
    patch:
      tags: [Users]
      summary: Ativar ou desativar usuário (somente Admin)
      operationId: updateUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '204':
          description: Status atualizado com sucesso (sem corpo de retorno)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:

    Role:
      type: string
      description: |
        Perfis de acesso do MVP.
        - ADMIN: Gestor total da plataforma (catálogo global, temas, supermercados).
        - GESTOR: Responsável por um supermercado (ofertas, encartes, whitelabel).
        > CLIENTE (pós-MVP): Perfil com cadastro completo, favoritos e lista de compras.
      enum: [ADMIN, GESTOR]

    UserStatus:
      type: string
      enum: [ATIVO, INATIVO, BLOQUEADO]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    CreateUserRequest:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'
        reason:
          type: string
          maxLength: 255

    AuthTokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Duração do access token em segundos

    UserResponse:
      type: object
      required: [id, name, email, role, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Request accepted

    ErrorResponse:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
