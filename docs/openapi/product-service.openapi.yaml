openapi: 3.0.3
info:
  title: SmartMarket Product Service API
  version: 2.0.0
  description: |
    Contrato dos módulos `catalog`, `offer` e `flyer` para o MVP (v2.0).
    
    Responsável por:
    - Catálogo Global de Produtos mantido pelo Admin (RF-03)
    - Gestão de Ofertas por Supermercado (RF-04)
    - Temas Sazonais geridos pelo Admin (RF-05.1)
    - Encartes Digitais criados pelo Gestor (RF-05)
servers:
  - url: /api/v1
tags:
  - name: Categorias
    description: Categorias do catálogo global (Admin)
  - name: Produtos Base
    description: Catálogo global de produtos base (Admin)
  - name: Temas Encarte
    description: Temas sazonais para encartes (Admin)
  - name: Ofertas
    description: Ofertas associando produtos a preços promocionais por supermercado (Gestor)
  - name: Encartes Digitais
    description: Encartes digitais com tema + lista de ofertas (Gestor)

paths:

  # ── CATEGORIAS (Admin) ──────────────────────────────────────────────────

  /categorias:
    get:
      tags: [Categorias]
      summary: Listar categorias do catálogo global
      operationId: listCategories
      responses:
        '200':
          description: Lista de categorias carregada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'

  # ── PRODUTOS BASE (Admin) ────────────────────────────────────────────────

  /produtos-base:
    get:
      tags: [Produtos Base]
      summary: Buscar todos os produtos do catálogo base
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Lista de produtos carregada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProdutoBase'

    post:
      tags: [Produtos Base]
      summary: Criar produto no catálogo global (Admin)
      description: Suporta envio via application/json ou multipart/form-data com upload direto de imagem.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoBase'
          multipart/form-data:
            schema:
              type: object
              required: [produto]
              properties:
                produto:
                  $ref: '#/components/schemas/ProdutoBase'
                imagem:
                  type: string
                  format: binary
                  description: Arquivo de imagem do produto (opcional)
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoBase'

  /produtos-base/{id}:
    put:
      tags: [Produtos Base]
      summary: Atualizar produto (Admin)
      description: Suporta payload JSON ou Multipart para atualizar os dados e a imagem do produto.
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoBase'
          multipart/form-data:
            schema:
              type: object
              required: [produto]
              properties:
                produto:
                  $ref: '#/components/schemas/ProdutoBase'
                imagem:
                  type: string
                  format: binary
                  description: Nova imagem para substituição (opcional)
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoBase'

  /produtos-base/busca:
    get:
      tags: [Produtos Base]
      summary: Buscar produtos por nome
      operationId: searchProductsByName
      parameters:
        - name: nome
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Produtos encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProdutoBase'

  # ── TEMAS SAZONAIS (Admin) ────────────────────────────────────────────────

  /temas-encarte:
    get:
      tags: [Temas Encarte]
      summary: Listar temas sazonais
      operationId: listThemes
      responses:
        '200':
          description: Lista de temas cadastrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemaEncarte'

    post:
      tags: [Temas Encarte]
      summary: Criar tema sazonal (Admin)
      operationId: createTheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemaEncarte'
      responses:
        '201':
          description: Tema criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemaEncarte'

  /temas-encarte/{id}:
    get:
      tags: [Temas Encarte]
      summary: Consultar tema por ID
      operationId: getThemeById
      parameters:
        - $ref: '#/components/parameters/ThemeIdPath'
      responses:
        '200':
          description: Tema encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemaEncarte'
        '404':
          description: Tema não encontrado

    put:
      tags: [Temas Encarte]
      summary: Atualizar tema sazonal (Admin)
      operationId: updateTheme
      parameters:
        - $ref: '#/components/parameters/ThemeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemaEncarte'
      responses:
        '200':
          description: Tema atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemaEncarte'

  /temas-encarte/{id}/upload-background:
    post:
      tags: [Temas Encarte]
      summary: Upload do background decorativo do tema (Admin)
      operationId: uploadThemeBackground
      parameters:
        - $ref: '#/components/parameters/ThemeIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo do background decorativo do tema
      responses:
        '200':
          description: Upload realizado e background vinculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemaEncarte'

  # ── OFERTAS (Gestor) ─────────────────────────────────────────────────────

  /ofertas:
    get:
      tags: [Ofertas]
      summary: Listar todas as ofertas de um supermercado (Gestor)
      operationId: listOffers
      parameters:
        - name: supermercadoId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de ofertas do supermercado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfertaSupermercado'

  /ofertas/supermercado/{supermercadoId}/produto/{produtoBaseId}:
    post:
      tags: [Ofertas]
      summary: Criar nova oferta (Gestor)
      description: Associa um produto base e define o preço para o supermercado correspondente.
      operationId: createOffer
      parameters:
        - name: supermercadoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: produtoBaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaSupermercado'
      responses:
        '201':
          description: Oferta cadastrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaSupermercado'
        '409':
          description: Conflito - Oferta já cadastrada para o produto/período

  /ofertas/{id}/produto/{produtoBaseId}:
    put:
      tags: [Ofertas]
      summary: Atualizar oferta (Gestor)
      operationId: updateOffer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: produtoBaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaSupermercado'
      responses:
        '200':
          description: Oferta atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaSupermercado'

  /ofertas/{id}:
    delete:
      tags: [Ofertas]
      summary: Excluir/Remover oferta (Gestor)
      operationId: deleteOffer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '240':
          description: O código retorna 204 No Content
        '204':
          description: Oferta removida com sucesso

  # ── ENCARTES DIGITAIS (Gestor) ───────────────────────────────────────────

  /encartes:
    get:
      tags: [Encartes Digitais]
      summary: Listar encartes digitais do supermercado
      operationId: listFlyers
      parameters:
        - name: supermercadoId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de encartes digitais
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EncarteDigital'

    post:
      tags: [Encartes Digitais]
      summary: Criar novo encarte digital (Gestor)
      operationId: createFlyer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncarteDigitalRequest'
      responses:
        '201':
          description: Encarte digital criado com status RASCUNHO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncarteDigitalResponse'

  /encartes/{id}:
    get:
      tags: [Encartes Digitais]
      summary: Consultar encarte por ID
      operationId: getFlyerById
      parameters:
        - $ref: '#/components/parameters/FlyerIdPath'
      responses:
        '200':
          description: Encarte digital encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncarteDigitalResponse'
        '404':
          description: Encarte não encontrado

    put:
      tags: [Encartes Digitais]
      summary: Atualizar encarte (Gestor)
      operationId: updateFlyer
      parameters:
        - $ref: '#/components/parameters/FlyerIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncarteDigitalRequest'
      responses:
        '200':
          description: Encarte atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncarteDigitalResponse'

  /encartes/{id}/status:
    patch:
      tags: [Encartes Digitais]
      summary: Alterar status do encarte (ex. publicar ou arquivar)
      operationId: updateFlyerStatus
      parameters:
        - $ref: '#/components/parameters/FlyerIdPath'
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/EncarteStatus'
      responses:
        '200':
          description: Status do encarte atualizado (ex. ATIVO, ENCERRADO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncarteDigitalResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ThemeIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FlyerIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:

    Categoria:
      type: object
      required: [id, nome]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        slug:
          type: string
        iconeUrl:
          type: string
        ordemExibicao:
          type: integer
        ativo:
          type: boolean

    ProdutoBase:
      type: object
      required: [nome, unidadeMedida]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        unidadeMedida:
          type: string
          example: UN
        urlImagem:
          type: string
        criadoEm:
          type: string
          format: date-time

    TemaEncarte:
      type: object
      required: [nome]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        urlBackgroundDecorativo:
          type: string
        corFundoHex:
          type: string
        corDestaqueHex:
          type: string
        ativo:
          type: boolean
        criadoEm:
          type: string
          format: date-time

    OfertaSupermercado:
      type: object
      required: [supermercadoId, produtoBaseId, precoAtual]
      properties:
        id:
          type: string
          format: uuid
        supermercadoId:
          type: string
          format: uuid
        produtoBaseId:
          type: string
          format: uuid
        nomeProduto:
          type: string
        preco:
          type: number
          format: double
        unidadeMedida:
          type: string
        urlImagem:
          type: string
        ativo:
          type: boolean
        precoAtual:
          type: number
          format: double
        precoPromocional:
          type: number
          format: double
        criadoEm:
          type: string
          format: date-time

    EncarteStatus:
      type: string
      enum: [RASCUNHO, ATIVO, ENCERRADO]
      example: RASCUNHO

    EncarteDigitalRequest:
      type: object
      required: [supermercadoId, titulo]
      properties:
        supermercadoId:
          type: string
          format: uuid
        temaId:
          type: string
          format: uuid
          nullable: true
        titulo:
          type: string
        dataInicio:
          type: string
          format: date-time
        dataFim:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EncarteStatus'
        ofertaIds:
          type: array
          items:
            type: string
            format: uuid

    EncarteDigitalResponse:
      type: object
      required: [id, supermercadoId, titulo, status]
      properties:
        id:
          type: string
          format: uuid
        supermercadoId:
          type: string
          format: uuid
        temaId:
          type: string
          format: uuid
          nullable: true
        titulo:
          type: string
        dataInicio:
          type: string
          format: date-time
        dataFim:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EncarteStatus'
        itens:
          type: array
          items:
            $ref: '#/components/schemas/EncarteItemResponse'

    EncarteItemResponse:
      type: object
      required: [id, ofertaId, ordemExibicao, destaque]
      properties:
        id:
          type: string
          format: uuid
        ofertaId:
          type: string
          format: uuid
        nomeProduto:
          type: string
        precoExibicao:
          type: number
          format: double
        unidadeMedida:
          type: string
        urlImagem:
          type: string
        ordemExibicao:
          type: integer
        destaque:
          type: boolean

    EncarteDigital:
      type: object
      required: [id, supermercadoId, titulo, status]
      properties:
        id:
          type: string
          format: uuid
        supermercadoId:
          type: string
          format: uuid
        temaId:
          type: string
          format: uuid
          nullable: true
        titulo:
          type: string
        dataInicio:
          type: string
          format: date-time
        dataFim:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EncarteStatus'

    ErrorResponse:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
