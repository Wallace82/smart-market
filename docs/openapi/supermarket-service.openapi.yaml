openapi: 3.0.3
info:
  title: SmartMarket Supermarket Service API
  version: 2.0.0
  description: |
    Contrato do módulo `supermarket` para o MVP do SmartMarket (v2.0).
    
    Responsável por:
    - Cadastro e aprovação de supermercados (RF-02.1)
    - Personalização Whitelabel: logomarca, cor primária e secundária (RF-02.2, RF-02.3)
    - Configuração de geolocalização da loja (RF-02.4)
    - QR Code único por loja (RF-07)
    - Vitrine pública: busca por proximidade e CEP/bairro (RF-06)
    
    > **Planos e assinaturas (billing) são pós-MVP.** Ver `billing-service.openapi.yaml`.
servers:
  - url: /api/v1
tags:
  - name: Supermarkets
    description: CRUD e aprovação de supermercados (Admin)
  - name: Whitelabel
    description: Personalização visual da loja (Gestor)
  - name: Public
    description: Endpoints públicos — não requerem autenticação (RF-01.4)
  - name: QRCode
    description: QR Code único da loja (RF-07)

paths:

  # ---------------------------------------------------------------------------
  # ADMIN — Gestão de Supermercados
  # ---------------------------------------------------------------------------

  /supermarkets:
    get:
      tags: [Supermarkets]
      summary: Listar supermercados (Admin)
      description: Retorna lista paginada de todos os supermercados cadastrados.
      operationId: listSupermarkets
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SupermarketStatus'
      responses:
        '200':
          description: Lista paginada de supermercados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSupermarketResponse'

    post:
      tags: [Supermarkets]
      summary: Cadastrar supermercado (Admin)
      description: Cria um novo supermercado com status PENDENTE. O Admin deve aprová-lo via PATCH /status.
      operationId: createSupermarket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupermarketRequest'
      responses:
        '201':
          description: Supermercado criado com status PENDENTE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupermarketResponse'
        '409':
          description: CNPJ já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /supermarkets/{id}:
    get:
      tags: [Supermarkets]
      summary: Consultar supermercado por ID
      operationId: getSupermarketById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupermarketIdPath'
      responses:
        '200':
          description: Supermercado encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupermarketResponse'
        '404':
          description: Supermercado não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /supermarkets/{id}/status:
    patch:
      tags: [Supermarkets]
      summary: Aprovar ou bloquear supermercado (Admin)
      description: Atualiza o status do supermercado (RF-02.1). Apenas ADMIN.
      operationId: updateSupermarketStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupermarketIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupermarketStatusRequest'
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupermarketResponse'

  # ---------------------------------------------------------------------------
  # GESTOR — Whitelabel e Configurações da Loja
  # ---------------------------------------------------------------------------

  /supermarkets/{id}/whitelabel:
    put:
      tags: [Whitelabel]
      summary: Atualizar identidade visual da loja (Gestor)
      description: |
        Permite ao Gestor configurar a paleta de cores (RF-02.3) e endereço/coordenadas (RF-02.4).
        O upload da logomarca é feito separadamente via `/supermarkets/{id}/logo` (multipart).
      operationId: updateWhitelabel
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupermarketIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWhitelabelRequest'
      responses:
        '200':
          description: Identidade visual atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupermarketResponse'
        '404':
          description: Supermercado não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /supermarkets/{id}/logo:
    post:
      tags: [Whitelabel]
      summary: Upload da logomarca da loja (Gestor)
      description: |
        Faz upload da logomarca para o MinIO (bucket `smartmarket-brands`).
        Retorna a URL pública da imagem (RF-02.2).
      operationId: uploadLogo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupermarketIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo de imagem (PNG, JPG, SVG). Tamanho máximo 2MB.
      responses:
        '200':
          description: Logo enviada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoUploadResponse'
        '400':
          description: Arquivo inválido ou excede limite de tamanho
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # GESTOR — QR Code da Loja (RF-07)
  # ---------------------------------------------------------------------------

  /supermarkets/{id}/qrcode:
    get:
      tags: [QRCode]
      summary: Obter QR Code da loja (Gestor)
      description: |
        Retorna os dados do QR Code único e permanente da loja, pronto para impressão (RF-07.1).
        O QR Code aponta para o encarte digital ativo e inclui parâmetro UTM (RF-07.4).
      operationId: getSupermarketQrCode
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupermarketIdPath'
      responses:
        '200':
          description: QR Code gerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrCodeResponse'

  # ---------------------------------------------------------------------------
  # PÚBLICO — Vitrine e Geolocalização (RF-06)
  # ---------------------------------------------------------------------------

  /public/supermarkets/nearby:
    get:
      tags: [Public]
      summary: Buscar supermercados próximos por GPS (público)
      description: |
        Retorna supermercados dentro do raio padrão de 3 km a partir das coordenadas GPS fornecidas (RF-06.1, RF-06.2).
        **Não requer autenticação** (RF-01.4).
      operationId: listNearbySupermarkets
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radiusMeters
          in: query
          required: false
          description: Raio de busca. Padrão de 3 km conforme RF-06.2.
          schema:
            type: integer
            minimum: 100
            maximum: 50000
            default: 3000
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Supermercados próximos encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPublicSupermarketResponse'

  /public/supermarkets/by-location:
    get:
      tags: [Public]
      summary: Buscar supermercados por CEP ou bairro (público)
      description: |
        Permite busca manual de supermercados quando o usuário nega permissão de GPS (RF-06.3).
        Aceita CEP (8 dígitos) ou nome de bairro. **Não requer autenticação**.
      operationId: listSupermarketsByLocation
      parameters:
        - name: cep
          in: query
          required: false
          description: CEP com 8 dígitos (sem hífen)
          schema:
            type: string
            pattern: '^\d{8}$'
        - name: bairro
          in: query
          required: false
          description: Nome do bairro (busca parcial, min 3 caracteres)
          schema:
            type: string
            minLength: 3
            maxLength: 80
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Supermercados encontrados na localidade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPublicSupermarketResponse'
        '400':
          description: Pelo menos um parâmetro (cep ou bairro) deve ser informado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public/supermarkets/{id}:
    get:
      tags: [Public]
      summary: Consultar perfil público do supermercado
      description: Retorna dados públicos do supermercado incluindo identidade visual (whitelabel) para renderização da vitrine (RF-05.3).
      operationId: getPublicSupermarket
      parameters:
        - $ref: '#/components/parameters/SupermarketIdPath'
      responses:
        '200':
          description: Perfil público encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSupermarketResponse'
        '404':
          description: Supermercado não encontrado ou inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SupermarketIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:

    SupermarketStatus:
      type: string
      description: |
        - PENDENTE: Aguardando aprovação do Admin (RF-02.1)
        - ATIVO: Aprovado e visível na vitrine pública
        - INATIVO: Desativado pelo Gestor ou Admin
        - BLOQUEADO: Bloqueado por violação de termos
      enum: [PENDENTE, ATIVO, INATIVO, BLOQUEADO]

    CreateSupermarketRequest:
      type: object
      required: [tradeName, cnpj, address, latitude, longitude]
      properties:
        tradeName:
          type: string
          minLength: 3
          maxLength: 120
        cnpj:
          type: string
          description: CNPJ com 14 dígitos (sem formatação)
          pattern: '^\d{14}$'
        address:
          type: string
          maxLength: 255
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    UpdateSupermarketStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/SupermarketStatus'
        reason:
          type: string
          maxLength: 255

    UpdateWhitelabelRequest:
      type: object
      description: Configurações de identidade visual e localização da loja (RF-02.3, RF-02.4)
      properties:
        primaryColorHex:
          type: string
          description: Cor primária em hexadecimal (ex. #16a34a)
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#16a34a'
        secondaryColorHex:
          type: string
          description: Cor secundária em hexadecimal
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#0284c7'
        address:
          type: string
          maxLength: 255
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    SupermarketResponse:
      type: object
      required: [id, tradeName, cnpj, status]
      properties:
        id:
          type: string
          format: uuid
        tradeName:
          type: string
        cnpj:
          type: string
        status:
          $ref: '#/components/schemas/SupermarketStatus'
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        logoUrl:
          type: string
          format: uri
          description: URL pública da logomarca no MinIO (bucket smartmarket-brands)
        primaryColorHex:
          type: string
          example: '#16a34a'
        secondaryColorHex:
          type: string
          example: '#0284c7'
        createdAt:
          type: string
          format: date-time

    PublicSupermarketResponse:
      type: object
      description: Visão pública do supermercado — usada na vitrine e na renderização do encarte (RF-05.3)
      required: [id, tradeName, status]
      properties:
        id:
          type: string
          format: uuid
        tradeName:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        logoUrl:
          type: string
          format: uri
        primaryColorHex:
          type: string
        secondaryColorHex:
          type: string

    NearbyPublicSupermarketResponse:
      description: Supermercado com distância calculada (RF-06.2)
      allOf:
        - $ref: '#/components/schemas/PublicSupermarketResponse'
        - type: object
          required: [distanceMeters]
          properties:
            distanceMeters:
              type: integer
              description: Distância em metros a partir das coordenadas fornecidas

    LogoUploadResponse:
      type: object
      required: [logoUrl]
      properties:
        logoUrl:
          type: string
          format: uri
          description: URL pública da logomarca no MinIO

    QrCodeResponse:
      type: object
      required: [supermarketId, qrCodeUrl, targetUrl]
      properties:
        supermarketId:
          type: string
          format: uuid
        qrCodeUrl:
          type: string
          format: uri
          description: URL da imagem PNG do QR Code para download e impressão (RF-07.1)
        targetUrl:
          type: string
          format: uri
          description: URL de destino do QR Code com parâmetro UTM (RF-07.4). Ex. /loja/uuid?utm_source=totem
        utmSource:
          type: string
          example: totem

    PageMetadata:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    PagedSupermarketResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SupermarketResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PagedPublicSupermarketResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/NearbyPublicSupermarketResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    ErrorResponse:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
