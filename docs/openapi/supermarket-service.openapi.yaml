openapi: 3.0.3
info:
  title: SmartMarket Supermarket Service API
  version: 2.0.0
  description: |
    Contrato do módulo `supermarket` para o MVP do SmartMarket (v2.0).
    
    Responsável por:
    - Cadastro, listagem e aprovação de supermercados (RF-02.1)
    - Personalização Whitelabel: logomarca, cor primária e secundária (RF-02.2, RF-02.3)
    - Configuração de geolocalização da loja (RF-02.4)
    - QR Code único por loja (RF-07)
    - Vitrine pública: busca por proximidade e CEP/bairro (RF-06)
servers:
  - url: /api/v1
tags:
  - name: Supermercados
    description: CRUD, Whitelabel e aprovação de supermercados
  - name: Public
    description: Endpoints públicos — não requerem autenticação (RF-01.4)

paths:

  /supermercados:
    get:
      tags: [Supermercados]
      summary: Listar supermercados (Admin)
      description: Retorna lista paginada de todos os supermercados cadastrados.
      operationId: listSupermarkets
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Lista paginada de supermercados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSupermarketResponse'

    post:
      tags: [Supermercados]
      summary: Cadastrar supermercado (Admin)
      description: Cria um novo supermercado com status PENDENTE. O Admin deve aprová-lo via PATCH /status.
      operationId: createSupermarket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupermercadoRequest'
      responses:
        '201':
          description: Supermercado criado com status PENDENTE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupermercadoResponse'

  /supermercados/{id}:
    get:
      tags: [Supermercados]
      summary: Consultar supermercado por ID
      operationId: getSupermarketById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupermarketIdPath'
      responses:
        '200':
          description: Supermercado encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupermercadoResponse'
        '404':
          description: Supermercado não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Supermercados]
      summary: Atualizar supermercado / Whitelabel (Gestor)
      description: Permite ao gestor atualizar os dados gerais, cores do design system whitelabel e coordenadas GPS da loja.
      operationId: updateSupermarket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupermarketIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupermercadoRequest'
      responses:
        '200':
          description: Supermercado atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupermercadoResponse'
        '400':
          description: Payload ou parâmetros de validação inválidos
        '404':
          description: Supermercado não encontrado

  /supermercados/{id}/upload-logomarca:
    post:
      tags: [Supermercados]
      summary: Upload da logomarca da loja (Gestor)
      description: Faz upload da logomarca para o MinIO (bucket `smartmarket-brands`) e atualiza a URL no cadastro.
      operationId: uploadLogo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupermarketIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo de imagem (PNG, JPG, SVG). Máximo 2MB.
      responses:
        '200':
          description: Logomarca enviada e vinculada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupermercadoResponse'
        '400':
          description: Arquivo inválido ou vazio

  /supermercados/gestor/{gestorId}:
    get:
      tags: [Supermercados]
      summary: Buscar supermercados administrados por um gestor específico
      operationId: listSupermarketsByGestor
      security:
        - bearerAuth: []
      parameters:
        - name: gestorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de supermercados vinculados ao gestor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupermercadoResponse'

  /supermercados/{id}/status:
    patch:
      tags: [Supermercados]
      summary: Aprovar ou alterar status do supermercado (Admin)
      description: Atualiza o status do supermercado (Aprovação, Bloqueio, Desativação).
      operationId: updateSupermarketStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupermarketIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupermarketStatusRequest'
      responses:
        '200':
          description: Status atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupermercadoResponse'

  /supermercados/{id}/qrcode:
    get:
      tags: [Supermercados]
      summary: Obter URL permanente do QR Code da loja
      description: Retorna a URL do QR Code gerado que aponta para o encarte ativo Whitelabel com parâmetros UTM.
      operationId: getQRCode
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupermarketIdPath'
      responses:
        '200':
          description: Link do QR Code obtido com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrCodeResponse'

  # ── ENDPOINTS PÚBLICOS (Vitrine / Geolocalização) ──────────────────────────

  /supermercados/public/nearby:
    get:
      tags: [Public]
      summary: Buscar supermercados próximos por GPS (público)
      description: Retorna supermercados ativos dentro do raio em metros a partir das coordenadas fornecidas (Fórmula de Haversine).
      operationId: listNearbySupermarkets
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: radiusMeters
          in: query
          required: false
          schema:
            type: integer
            default: 3000
      responses:
        '200':
          description: Supermercados próximos encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupermercadoResponse'

  /supermercados/public/by-location:
    get:
      tags: [Public]
      summary: Buscar supermercados por CEP ou bairro (público)
      description: Fallback para quando o usuário desativa ou nega a permissão de geolocalização.
      operationId: listSupermarketsByLocation
      parameters:
        - name: cep
          in: query
          required: false
          schema:
            type: string
        - name: bairro
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Supermercados encontrados para a localização informada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSupermarketResponse'
        '400':
          description: Pelo menos um parâmetro (cep ou bairro) deve ser informado

  /supermercados/public/{id}:
    get:
      tags: [Public]
      summary: Consultar perfil público Whitelabel do supermercado
      description: Retorna dados e cores institucionais do supermercado ativo. Apenas supermercados com status ATIVO podem ser acessados publicamente.
      operationId: getPublicSupermarket
      parameters:
        - $ref: '#/components/parameters/SupermarketIdPath'
      responses:
        '200':
          description: Perfil público encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupermercadoResponse'
        '404':
          description: Supermercado não encontrado ou inativo

  /campanhas:
    post:
      tags: [Supermercados]
      summary: Cadastrar campanha de Push Geofence (Gestor)
      description: Cria uma nova campanha geolocalizada para o supermercado.
      operationId: createCampaign
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampanhaRequest'
      responses:
        '201':
          description: Campanha cadastrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampanhaResponse'

  /campanhas/supermercado/{supermercadoId}:
    get:
      tags: [Supermercados]
      summary: Listar campanhas por supermercado (Gestor)
      description: Retorna todas as campanhas vinculadas ao supermercado.
      operationId: listCampaignsBySupermarket
      security:
        - bearerAuth: []
      parameters:
        - name: supermercadoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de campanhas encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampanhaResponse'

  /campanhas/{id}/status:
    patch:
      tags: [Supermercados]
      summary: Alterar status da campanha (Gestor)
      description: Altera o status da campanha (Ativa, Pausada, Concluída).
      operationId: updateCampaignStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Ativa, Pausada, Concluída]
      responses:
        '200':
          description: Status atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampanhaResponse'

  /campanhas/{id}:
    delete:
      tags: [Supermercados]
      summary: Deletar campanha (Gestor)
      description: Exclui permanentemente uma campanha.
      operationId: deleteCampaign
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Campanha deletada com sucesso

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SupermarketIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:

    SupermercadoStatus:
      type: string
      enum: [PENDENTE, ATIVO, INATIVO, BLOQUEADO]
      example: ATIVO

    SupermercadoRequest:
      type: object
      required: [nomeFantasia, cnpj, endereco, latitude, longitude]
      properties:
        nomeFantasia:
          type: string
          minLength: 3
          maxLength: 120
        cnpj:
          type: string
          pattern: '^\d{14}$'
        endereco:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        raioAtuacao:
          type: integer
          default: 3000
        gestorId:
          type: string
          format: uuid
        urlLogomarca:
          type: string
        corPrimariaHex:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#16a34a'
        corSecundariaHex:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#0284c7'
        email:
          type: string
          format: email
        telefone:
          type: string
        cep:
          type: string
        cidade:
          type: string
        estado:
          type: string

    SupermercadoResponse:
      type: object
      required: [id, nomeFantasia, cnpj, status]
      properties:
        id:
          type: string
          format: uuid
        nomeFantasia:
          type: string
        cnpj:
          type: string
        status:
          $ref: '#/components/schemas/SupermercadoStatus'
        endereco:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        raioAtuacao:
          type: integer
        gestorId:
          type: string
          format: uuid
        urlLogomarca:
          type: string
        corPrimariaHex:
          type: string
        corSecundariaHex:
          type: string
        email:
          type: string
        telefone:
          type: string
        cep:
          type: string
        cidade:
          type: string
        estado:
          type: string
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time

    UpdateSupermarketStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/SupermercadoStatus'
        reason:
          type: string

    QrCodeResponse:
      type: object
      required: [supermarketId, qrCodeUrl, targetUrl]
      properties:
        supermarketId:
          type: string
          format: uuid
        qrCodeUrl:
          type: string
        targetUrl:
          type: string
        utmSource:
          type: string
          example: totem

    PageMetadata:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    PagedSupermarketResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SupermercadoResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    CampanhaRequest:
      type: object
      required: [supermercadoId, nome, segmento, raio]
      properties:
        supermercadoId:
          type: string
          format: uuid
        nome:
          type: string
        segmento:
          type: string
        raio:
          type: string
        status:
          type: string

    CampanhaResponse:
      type: object
      required: [id, supermercadoId, nome, segmento, raio, status, pushesEnviados, conversoes]
      properties:
        id:
          type: string
          format: uuid
        supermercadoId:
          type: string
          format: uuid
        nome:
          type: string
        segmento:
          type: string
        raio:
          type: string
        status:
          type: string
        pushesEnviados:
          type: integer
        conversoes:
          type: integer
        criadoEm:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
