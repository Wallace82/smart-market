<div class="mb-6">
  <h1 class="text-3xl font-bold text-gray-800">Dashboard do Administrador</h1>
  <p class="text-gray-500">Visão geral da plataforma SmartMarket.</p>
</div>

<ng-container *ngIf="loading(); else content">
  <div class="flex justify-center items-center h-64">
    <mat-spinner></mat-spinner>
  </div>
</ng-container>

<ng-template #content>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <app-metric-card *ngFor="let metric of metrics()" [metric]="metric"></app-metric-card>
  </div>
</ng-template>
