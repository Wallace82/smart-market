<div class="h-[calc(100vh-4rem)] flex flex-col font-sans -m-6">
  
  <!-- Editor Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0 shadow-sm relative z-10">
    <div class="flex items-center gap-4">
      <button routerLink="/admin/themes" class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      </button>
      <div>
        <h1 class="text-xl font-bold text-gray-900 flex items-center gap-2">
          Editor Visual: 
          <input type="text" [(ngModel)]="themeName" class="border-b-2 border-transparent hover:border-gray-300 focus:border-[color:var(--color-primary)] focus:outline-none bg-transparent py-1 px-2 rounded-sm transition-colors text-[color:var(--color-primary)] w-80">
        </h1>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button routerLink="/admin/themes" class="px-4 py-2 text-gray-600 font-medium hover:bg-gray-100 rounded-md transition-colors">Descartar</button>
      <button (click)="saveTheme()" class="px-6 py-2 bg-[color:var(--color-primary)] hover:bg-[color:var(--color-primary-dark)] text-white font-bold rounded-md shadow-sm transition-colors flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        Salvar e Publicar
      </button>
    </div>
  </header>

  <!-- Editor Body -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Left Sidebar: Controls -->
    <aside class="w-80 bg-white border-r border-gray-200 overflow-y-auto shrink-0 flex flex-col shadow-inner">
      <div class="p-6 border-b border-gray-100">
        <h3 class="font-bold text-gray-900 mb-4 flex items-center gap-2">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>
          Cores da Campanha
        </h3>
        
        <!-- Primary Color -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-2">Cor Primária (Destaques)</label>
          <div class="flex items-center gap-3">
            <div class="relative w-10 h-10 rounded shadow-sm border border-gray-200 overflow-hidden cursor-pointer">
              <input type="color" [(ngModel)]="primaryColor" class="absolute -top-2 -left-2 w-14 h-14 cursor-pointer border-0 p-0">
            </div>
            <input type="text" [(ngModel)]="primaryColor" class="flex-1 block w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:ring-[color:var(--color-primary)] focus:border-[color:var(--color-primary)] sm:text-sm uppercase font-mono">
          </div>
        </div>

        <!-- Secondary Color -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Cor de Fundo (Backgrounds)</label>
          <div class="flex items-center gap-3">
            <div class="relative w-10 h-10 rounded shadow-sm border border-gray-200 overflow-hidden cursor-pointer">
              <input type="color" [(ngModel)]="secondaryColor" class="absolute -top-2 -left-2 w-14 h-14 cursor-pointer border-0 p-0">
            </div>
            <input type="text" [(ngModel)]="secondaryColor" class="flex-1 block w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:ring-[color:var(--color-primary)] focus:border-[color:var(--color-primary)] sm:text-sm uppercase font-mono">
          </div>
        </div>
      </div>

      <div class="p-6 border-b border-gray-100">
        <h3 class="font-bold text-gray-900 mb-4 flex items-center gap-2">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path></svg>
          Tipografia
        </h3>
        <select [(ngModel)]="fontFamily" class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-[color:var(--color-primary)] focus:border-[color:var(--color-primary)] sm:text-sm rounded-md">
          <option value="Inter">Inter (Padrão Moderno)</option>
          <option value="Roboto">Roboto (Clássico)</option>
          <option value="Outfit">Outfit (Display)</option>
          <option value="Comic Sans MS">Brincalhona (Infantil)</option>
        </select>
      </div>

      <div class="p-6 flex-1">
        <h3 class="font-bold text-gray-900 mb-4 flex items-center gap-2">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          Banner do Topo
        </h3>
        <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-gray-50 transition-colors">
          <svg class="w-8 h-8 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
          <span class="text-sm font-medium text-[color:var(--color-primary)]">Fazer upload</span>
          <span class="text-xs text-gray-500 mt-1">PNG, JPG até 5MB</span>
        </div>
      </div>
    </aside>

    <!-- Right Content: Live Preview -->
    <main class="flex-1 bg-gray-100 overflow-y-auto p-8 flex justify-center items-start pattern-grid">
      
      <!-- Simulador de Dispositivo -->
      <div class="w-full max-w-[375px] bg-white shadow-2xl overflow-hidden border-[12px] border-gray-900 relative transition-all duration-300 rounded-[2.5rem]" [style.fontFamily]="fontFamily()">
        
        <!-- Notch Fake -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1/3 h-5 bg-gray-900 rounded-b-xl z-50"></div>

        <!-- Header App Preview -->
        <div class="p-6 pb-8 pt-10 rounded-b-3xl relative overflow-hidden transition-colors duration-300" [style.backgroundColor]="primaryColor()">
          <!-- Pattern dinâmico com opacidade -->
          <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(white 2px, transparent 2px); background-size: 16px 16px;"></div>
          
          <div class="relative z-10 text-center">
            <h2 class="text-white text-2xl font-black leading-tight">{{ themeName() }}</h2>
            <p class="text-white/80 text-sm mt-1">Ofertas exclusivas para você!</p>
          </div>
        </div>

        <!-- Body App Preview -->
        <div class="p-4 min-h-[500px] transition-colors duration-300" [style.backgroundColor]="secondaryColor()">
          
          <!-- Banner Hero -->
          <div class="w-full h-32 rounded-xl bg-gradient-to-r from-gray-200 to-gray-300 shadow-sm flex items-center justify-center -mt-6 relative z-20 overflow-hidden border-2 border-white">
             <div class="absolute inset-0 flex items-center justify-center">
               <span class="text-gray-500 font-medium text-sm">Espaço do Banner</span>
             </div>
          </div>

          <!-- Section Title -->
          <div class="mt-6 mb-3 flex items-center justify-between">
            <h3 class="font-black text-gray-900 transition-colors duration-300" [style.color]="primaryColor()">Destaques do Dia</h3>
            <span class="text-xs font-bold bg-white px-2 py-1 rounded-full shadow-sm" [style.color]="primaryColor()">Ver todos</span>
          </div>

          <!-- Fake Products Grid -->
          <div class="grid grid-cols-2 gap-3">
            <!-- Product 1 -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
              <div class="w-full h-24 bg-gray-50 rounded-xl mb-3 flex items-center justify-center">
                <svg class="w-8 h-8 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              </div>
              <div class="h-3 bg-gray-200 rounded w-3/4 mb-1"></div>
              <div class="h-3 bg-gray-200 rounded w-1/2 mb-3"></div>
              <div class="h-8 w-full rounded-lg mt-auto transition-colors duration-300" [style.backgroundColor]="primaryColor()"></div>
            </div>
            <!-- Product 2 -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
              <div class="w-full h-24 bg-gray-50 rounded-xl mb-3 flex items-center justify-center">
                <svg class="w-8 h-8 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              </div>
              <div class="h-3 bg-gray-200 rounded w-3/4 mb-1"></div>
              <div class="h-3 bg-gray-200 rounded w-1/2 mb-3"></div>
              <div class="h-8 w-full rounded-lg mt-auto transition-colors duration-300" [style.backgroundColor]="primaryColor()"></div>
            </div>
          </div>
        </div>

      </div>
    </main>

  </div>
</div>
<style>
.pattern-grid {
  background-image: linear-gradient(to right, #e5e7eb 1px, transparent 1px), linear-gradient(to bottom, #e5e7eb 1px, transparent 1px);
  background-size: 20px 20px;
}
</style>
