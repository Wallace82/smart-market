<div class="bg-gray-50 min-h-screen py-16 flex flex-col items-center justify-center">
  <!-- Top decoration -->
  <div class="absolute inset-0 opacity-20 pointer-events-none">
    <div class="absolute -right-20 -top-20 w-96 h-96 bg-green-500 rounded-full blur-3xl"></div>
    <div class="absolute -left-20 -bottom-20 w-72 h-72 bg-orange-400 rounded-full blur-3xl"></div>
  </div>

  <div class="relative z-10 w-full max-w-lg px-6">
    <!-- Back to Home -->
    <a routerLink="/" mat-button class="!mb-6 !text-gray-500 hover:!text-gray-900 transition-colors">
      <mat-icon class="mr-1">arrow_back</mat-icon> Voltar
    </a>

    <!-- Card Principal -->
    <div class="bg-white rounded-3xl shadow-xl border border-gray-100 p-8 sm:p-10">
      
      <!-- Cabeçalho -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 text-green-600 shadow-inner">
          <mat-icon class="!w-8 !h-8 !text-[32px]">my_location</mat-icon>
        </div>
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Alterar Localização</h1>
        <p class="text-gray-500 font-medium mt-2">
          Informe seu CEP para descobrir as melhores ofertas da sua região.
        </p>
      </div>

      <!-- Formulário de Busca -->
      <div class="mb-6 relative">
        <label class="block text-sm font-bold text-gray-700 mb-2">Qual é o seu CEP?</label>
        <div class="flex items-center gap-3">
          <input 
            type="text" 
            [(ngModel)]="cep" 
            placeholder="Ex: 01001-000" 
            maxlength="9"
            class="flex-1 bg-gray-50 border border-gray-300 text-gray-900 text-lg rounded-xl focus:ring-green-500 focus:border-green-500 block w-full p-4 transition-all"
            (keyup.enter)="searchCep()"
          >
          <button 
            mat-flat-button 
            (click)="searchCep()" 
            [disabled]="isLoading()"
            class="!bg-green-600 hover:!bg-green-700 !text-white !rounded-xl !px-6 !py-6 !h-auto !text-base font-bold shadow-md transition-all">
            @if (isLoading()) {
              <mat-spinner diameter="24" class="!text-white"></mat-spinner>
            } @else {
              <mat-icon>search</mat-icon>
            }
          </button>
        </div>
      </div>

      <!-- Raio de Busca -->
      <div class="mb-6">
        <label class="block text-sm font-bold text-gray-700 mb-2">Raio de Busca (KM)</label>
        <select 
          [(ngModel)]="radius" 
          class="bg-gray-50 border border-gray-300 text-gray-900 text-lg rounded-xl focus:ring-green-500 focus:border-green-500 block w-full p-4 transition-all">
          <option [ngValue]="1">1 KM (Apenas a pé)</option>
          <option [ngValue]="3">3 KM (Bairro)</option>
          <option [ngValue]="5">5 KM (Região)</option>
          <option [ngValue]="10">10 KM (Longo alcance)</option>
        </select>
      </div>

      <!-- Resultado do Endereço -->
      @if (address()) {
        <div class="bg-blue-50 border border-blue-100 rounded-xl p-5 mb-8 animate-fade-in-up">
          <div class="flex items-start gap-3">
            <mat-icon class="text-blue-500 mt-0.5">place</mat-icon>
            <div>
              <p class="text-sm text-blue-800 font-bold mb-1">Endereço Encontrado:</p>
              <p class="text-gray-900 font-medium">{{ address().logradouro }}</p>
              <p class="text-gray-600 text-sm">{{ address().bairro }} - {{ address().localidade }}/{{ address().uf }}</p>
            </div>
          </div>
        </div>
      }

      <!-- Botão de Salvar -->
      <button 
        mat-flat-button 
        (click)="saveLocation()" 
        [disabled]="!address() || isSaving()"
        class="w-full !bg-orange-500 hover:!bg-orange-600 !text-white !rounded-xl !py-6 !text-lg font-bold shadow-lg transition-all disabled:!bg-gray-300 disabled:!text-gray-500">
        @if (isSaving()) {
          <mat-spinner diameter="24" class="mr-2 inline-block align-middle"></mat-spinner> Salvando...
        } @else {
          Confirmar Endereço
        }
      </button>

    </div>
  </div>
</div>

<style>
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.animate-fade-in-up {
  animation: fadeInUp 0.4s ease-out forwards;
}
</style>
