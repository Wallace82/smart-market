<!-- Logo -->
<div class="h-16 flex items-center justify-center px-4 border-b border-gray-200">
  <h1 class="text-2xl font-bold text-indigo-600">SmartMarket</h1>
</div>

<!-- Menu de Navegação -->
<mat-nav-list>
  <!-- Menu Admin -->
  <ng-container *ngIf="isAdmin()">
    <h3 mat-subheader>Admin</h3>
    <a mat-list-item routerLink="/admin/dashboard" routerLinkActive="bg-indigo-50 text-indigo-600">
      <mat-icon matListItemIcon>dashboard</mat-icon>
      <span matListItemTitle>Dashboard</span>
    </a>
    <a mat-list-item routerLink="/admin/supermarkets" routerLinkActive="bg-indigo-50 text-indigo-600">
      <mat-icon matListItemIcon>store</mat-icon>
      <span matListItemTitle>Supermercados</span>
    </a>
    <a mat-list-item routerLink="/admin/users" routerLinkActive="bg-indigo-50 text-indigo-600">
      <mat-icon matListItemIcon>group</mat-icon>
      <span matListItemTitle>Usuários</span>
    </a>
  </ng-container>

  <!-- Menu Gestor -->
  <ng-container *ngIf="isManager()">
    <h3 mat-subheader>Gestor</h3>
    <a mat-list-item routerLink="/manager/dashboard" routerLinkActive="bg-indigo-50 text-indigo-600">
      <mat-icon matListItemIcon>leaderboard</mat-icon>
      <span matListItemTitle>Dashboard</span>
    </a>
    <a mat-list-item routerLink="/manager/flyers" routerLinkActive="bg-indigo-50 text-indigo-600">
      <mat-icon matListItemIcon>feed</mat-icon>
      <span matListItemTitle>Encartes</span>
    </a>
    <a mat-list-item routerLink="/manager/offers" routerLinkActive="bg-indigo-50 text-indigo-600">
      <mat-icon matListItemIcon>sell</mat-icon>
      <span matListItemTitle>Ofertas</span>
    </a>
    <a mat-list-item routerLink="/manager/settings" routerLinkActive="bg-indigo-50 text-indigo-600">
      <mat-icon matListItemIcon>settings</mat-icon>
      <span matListItemTitle>Minha Loja</span>
    </a>
  </ng-container>

  <!-- Menu Cliente -->
  <ng-container *ngIf="isClient()">
    <h3 mat-subheader>Loja</h3>
    <a mat-list-item routerLink="/client/home" routerLinkActive="bg-indigo-50 text-indigo-600">
      <mat-icon matListItemIcon>home</mat-icon>
      <span matListItemTitle>Início</span>
    </a>
  </ng-container>
</mat-nav-list>
