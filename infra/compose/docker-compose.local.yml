services:
  postgres:
    image: postgres:16
    container_name: smartmarket-postgres
    environment:
      POSTGRES_DB: smartmarket
      POSTGRES_USER: smartmarket
      POSTGRES_PASSWORD: smartmarket
    ports:
      - "5432:5432"
    volumes:
      - smartmarket_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmarket -d smartmarket"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: smartmarket-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - smartmarket_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: smartmarket-redis
    ports:
      - "6379:6379"
    volumes:
      - smartmarket_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  create-bucket:
    image: minio/mc:latest
    container_name: smartmarket-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin password;
      /usr/bin/mc mb myminio/smartmarket-products --ignore-existing;
      /usr/bin/mc mb myminio/smartmarket-brands --ignore-existing;
      /usr/bin/mc mb myminio/smartmarket-themes --ignore-existing;
      /usr/bin/mc mb myminio/smartmarket-concierge --ignore-existing;
      /usr/bin/mc anonymous set download myminio/smartmarket-products;
      /usr/bin/mc anonymous set download myminio/smartmarket-brands;
      /usr/bin/mc anonymous set download myminio/smartmarket-themes;
      /usr/bin/mc anonymous set download myminio/smartmarket-concierge;
      exit 0;
      "

  auth-service:
    build:
      context: ../../backend/services/auth-service
    container_name: smartmarket-auth-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: smartmarket-postgres
      DB_PORT: 5432
      DB_NAME: smartmarket
      DB_USER: smartmarket
      DB_PASSWORD: smartmarket
    depends_on:
      postgres:
        condition: service_healthy

  supermarket-service:
    build:
      context: ../../backend/services/supermarket-service
    container_name: smartmarket-supermarket-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: smartmarket-postgres
      DB_PORT: 5432
      DB_NAME: smartmarket
      DB_USER: smartmarket
      DB_PASSWORD: smartmarket
      MINIO_URL: http://smartmarket-minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  product-service:
    build:
      context: ../../backend/services/product-service
    container_name: smartmarket-product-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: smartmarket-postgres
      DB_PORT: 5432
      DB_NAME: smartmarket
      DB_USER: smartmarket
      DB_PASSWORD: smartmarket
      MINIO_URL: http://smartmarket-minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  api-gateway:
    build:
      context: ../../backend/api-gateway
    container_name: smartmarket-api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://smartmarket-auth-service:8081
      SUPERMARKET_SERVICE_URL: http://smartmarket-supermarket-service:8082
      PRODUCT_SERVICE_URL: http://smartmarket-product-service:8083
      BILLING_SERVICE_URL: http://smartmarket-billing-service:8084
    depends_on:
      - auth-service
      - supermarket-service
      - product-service
      - billing-service

  billing-service:
    build:
      context: ../../backend/services/billing-service
    container_name: smartmarket-billing-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: smartmarket-postgres
      DB_PORT: 5432
      DB_NAME: smartmarket
      DB_USER: smartmarket
      DB_PASSWORD: smartmarket
    depends_on:
      postgres:
        condition: service_healthy

  concierge-service:
    build:
      context: ../../backend/services/concierge-service
    container_name: smartmarket-concierge-service
    ports:
      - "8085:8085"
    environment:
      DB_HOST: smartmarket-postgres
      DB_PORT: 5432
      DB_NAME: smartmarket
      DB_USER: smartmarket
      DB_PASSWORD: smartmarket
      MINIO_URL: http://smartmarket-minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  smartmarket_postgres_data:
  smartmarket_minio_data:
  smartmarket_redis_data: